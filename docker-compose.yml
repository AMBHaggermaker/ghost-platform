services:
  ghost:
    image: ghost:6.39.0
    container_name: ghost
    restart: unless-stopped
    env_file:
      - ghost.env
    ports:
      - "2368:2368"
    volumes:
      - C:\ghost\data:/var/lib/ghost/content
    environment:
      NODE_ENV: production
      url: https://unprecedentedtimes.org
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost-dev.db
      # Mail — Brevo SMTP relay
      mail__transport: SMTP
      mail__from: noreply@unprecedentedtimes.org
      mail__options__host: smtp-relay.brevo.com
      mail__options__port: "587"
      mail__options__auth__user: ac6361001@smtp-brevo.com
      mail__options__auth__pass: ${GHOST_MAIL_PASS}

      # Disable staff device verification so admin can log in with password only
      # (no 5-minute OTP email required)
      security__staffDeviceVerification: "false"
